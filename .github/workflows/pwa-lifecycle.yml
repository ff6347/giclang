# ABOUTME: Runs the production PWA lifecycle seam on supported desktop platforms.
# ABOUTME: Covers Chrome and Firefox on macOS and Windows plus WebKit on macOS.

name: Test PWA lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: chrome
            install: ""
          - os: macos-latest
            browser: firefox
            install: firefox
          - os: macos-latest
            browser: webkit
            install: webkit
          - os: windows-latest
            browser: chrome
            install: ""
          - os: windows-latest
            browser: firefox
            install: firefox

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        if: matrix.install != ''
        run: pnpm exec playwright install ${{ matrix.install }}

      - name: Test offline and update lifecycles
        run: pnpm test:pwa --project=${{ matrix.browser }} --retries=0

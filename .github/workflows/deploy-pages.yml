# ABOUTME: Builds the browser shell and deploys its static output to GitHub Pages.
# ABOUTME: Publishes the editor output with the repository-specific Pages base path.

name: Deploy browser preview to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build browser preview
        run: pnpm build:browser --base="${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

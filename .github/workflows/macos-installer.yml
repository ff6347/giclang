# ABOUTME: Builds an Apple Silicon installer probe and a gated macOS release candidate.
# ABOUTME: Keeps Apple credentials out of pull requests and verifies notarization before artifact retention.

name: Build macOS installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v0.9.0-beta.1'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop bridge
        run: pnpm test:desktop

      - name: Build unsigned DMG
        run: pnpm --filter @giclang/desktop exec tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Verify package version and record hash
        id: package
        run: |
          set -euo pipefail
          version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          dmg="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/GiC_${version}_aarch64.dmg"
          test -f "$dmg"
          mount="$RUNNER_TEMP/gic-probe-mounted"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          test "$(defaults read "$mount/GiC.app/Contents/Info" CFBundleShortVersionString)" = "${version%%-*}"
          test "$(defaults read "$mount/GiC.app/Contents/Info" CFBundleVersion)" = "$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").bundle.macOS.bundleVersion')"
          hdiutil detach "$mount"
          trap - EXIT
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'dmg=%s\n' "$dmg" >> "$GITHUB_OUTPUT"

      - name: Retain unsigned probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gic-macos-arm64-${{ steps.package.outputs.version }}-unsigned-spike
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          if-no-files-found: error

  release-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ff6347/giclang'
    environment: macos-release
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop bridge
        run: pnpm test:desktop

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure the Developer ID certificate in the macos-release environment."
            exit 1
          fi
          umask 077
          certificate="$RUNNER_TEMP/gic-signing.p12"
          keychain="$RUNNER_TEMP/gic-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:/ {print $2}')"
          if [[ -z "$identity" || "$identity" == *$'\n'* ]]; then
            echo "::error::Expected exactly one Developer ID Application identity."
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Build signed DMG
        run: pnpm --filter @giclang/desktop exec tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Notarize and verify DMG
        id: candidate
        shell: bash
        env:
          MACOS_API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_API_KEY_P8" || -z "$MACOS_API_KEY_ID" || -z "$MACOS_API_ISSUER" ]]; then
            echo "::error::Configure the App Store Connect team API key in the macos-release environment."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/gic-notary.p8"
          printf '%s' "$MACOS_API_KEY_P8" | base64 -D > "$key"
          version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          dmg="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/GiC_${version}_aarch64.dmg"
          test -f "$dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$MACOS_API_KEY_ID" --issuer "$MACOS_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/gic-notarization.json"
          if [[ "$(jq -r '.status' "$RUNNER_TEMP/gic-notarization.json")" != Accepted ]]; then
            echo "::error::Apple did not accept the DMG for notarization."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mount="$RUNNER_TEMP/gic-mounted"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount/GiC.app"
          codesign -dv --verbose=4 "$mount/GiC.app" 2>&1 | grep -Fq 'TeamIdentifier=WB5CKL86MX'
          test "$(defaults read "$mount/GiC.app/Contents/Info" CFBundleShortVersionString)" = "${version%%-*}"
          test "$(defaults read "$mount/GiC.app/Contents/Info" CFBundleVersion)" = "$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").bundle.macOS.bundleVersion')"
          spctl --assess --type execute --verbose=2 "$mount/GiC.app"
          hdiutil detach "$mount"
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          rm -f "$key" "$RUNNER_TEMP/gic-notarization.json"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'dmg=%s\n' "$dmg" >> "$GITHUB_OUTPUT"

      - name: Retain verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gic-macos-arm64-${{ steps.candidate.outputs.version }}-notarized-candidate
          path: |
            ${{ steps.candidate.outputs.dmg }}
            ${{ steps.candidate.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          if mount | grep -Fq " on $RUNNER_TEMP/gic-mounted ("; then
            hdiutil detach "$RUNNER_TEMP/gic-mounted"
          fi
          rm -f "$RUNNER_TEMP/gic-signing.p12" "$RUNNER_TEMP/gic-notary.p8" "$RUNNER_TEMP/gic-notarization.json"
          if [ -f "$RUNNER_TEMP/gic-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/gic-signing.keychain-db"
          fi

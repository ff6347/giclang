# ABOUTME: Defines the native package for the GIC desktop application.
# ABOUTME: Keeps the Tauri host separate from the shared browser IDE.

[package]
name = "gic-desktop"
version = "0.1.0"
description = "Desktop application for Gestalten in Code"
edition = "2021"

[lib]
name = "gic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

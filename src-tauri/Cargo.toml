# ABOUTME: Defines the native package for the GIC desktop application.
# ABOUTME: Keeps the Tauri host separate from the shared browser IDE.

[package]
name = "gic-desktop"
version = "0.1.0"
description = "Desktop application for Gestalten in Code"
edition = "2021"

[lib]
name = "gic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tempfile = "3.27.0"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

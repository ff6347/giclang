[workspace]
resolver = "2"
members = ["crates/tutor-core", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = [
	"macros",
	"rt-multi-thread",
	"sync",
	"time",
] }
tokio-util = "0.7.17"

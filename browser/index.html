<!-- ABOUTME: Defines the browser shell for editing and previewing GIC programs. -->
<!-- ABOUTME: Provides source input, diagnostics output, and the fixed-size canvas. -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GiC | Gestalten in Code</title>
	</head>
	<body>
		<h1>GiC</h1>
		<div id="code"></div>
		<canvas id="canvas" width="100" height="100"></canvas>
		<section aria-labelledby="problems-heading">
			<h2 id="problems-heading">Problems</h2>
			<div id="problems" aria-live="polite"></div>
		</section>
		<section aria-labelledby="output-heading">
			<h2 id="output-heading">Output</h2>
			<div id="output" aria-live="polite"></div>
		</section>
		<script src="src/main.ts" type="module"></script>
	</body>
</html>
